spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  storage:
    audio-dir: ./target/test-audio
  openai:
    # Tests never reach the network: FakeSpeechConfig replaces the OpenAI services.
    api-key: test-key
  public-base-url: http://localhost:8080
